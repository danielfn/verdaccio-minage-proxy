# Policy canary: checks every 6 h (cron) or on demand (workflow_dispatch)
# that the minAgeDays quarantine is still enforced end-to-end against the
# real endpoint (production LB; local stack for manual testing).
#
# Job failure is the alert: GitHub notifies repo watchers by default
# (the expected alert channel — see README "Operations" -> "Canary").
#
# Repo config requirements:
#   variable  REGISTRY_URL  — proxy endpoint (e.g. https://npm-proxy.example.com)
#   secrets   SERVICE_USER / SERVICE_PASS — service account (basic auth)
name: canary

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 h
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REGISTRY_URL: ${{ vars.REGISTRY_URL }}
      SERVICE_USER: ${{ secrets.SERVICE_USER }}
      SERVICE_PASS: ${{ secrets.SERVICE_PASS }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Policy canary (minAgeDays quarantine)
        run: ./scripts/canary.sh
