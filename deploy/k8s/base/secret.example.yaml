# DOCUMENTATIONAL EXAMPLE — do NOT apply as-is. Contains NO real secrets.
# This file is NOT part of the kustomization (not in resources): it documents
# the Secret contract the Deployment expects.
#
# The Secret is created OUTSIDE kustomize in each cluster (secrets never go
# into the repo; in CI it lives as an encrypted repo secret).
# Since it is not a kustomization resource, the overlays' namePrefix does NOT
# apply to it: create it with EXACTLY this name (verdaccio-htpasswd) in both
# clusters — the credentials are shared.
#
# Creation runbook (one command per cluster):
#   kubectl create secret generic verdaccio-htpasswd \
#     --from-file=htpasswd=conf/htpasswd \
#     --namespace <ns>
#
# Rotation runbook:
#   kubectl create secret generic verdaccio-htpasswd \
#     --from-file=htpasswd=conf/htpasswd --namespace <ns> \
#     --dry-run=client -o yaml | kubectl apply -f -
#   # subPath mounts do not refresh on their own: force a rollout (the
#   # deploy pipeline does it via the config-checksum annotation; by hand:
#   # kubectl rollout restart).
#
# Content format (conf/htpasswd): one `user:hash` line per account,
# ONLY bcrypt ($2a$/$2y$) — the verdaccio 6 verifier silently rejects
# SHA512-crypt from `openssl passwd -6`. Generate hashes with:
#   ./scripts/generate-htpasswd.sh <username> [password] >> conf/htpasswd
apiVersion: v1
kind: Secret
metadata:
  name: verdaccio-htpasswd
type: Opaque
stringData:
  htpasswd: |
    svc-repo-manager:$2a$10$...example-bcrypt-hash-not-real...
